<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- ألوان الخلفية والتدرج الذكي -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- خلفية كحلية انسيابية بحواف دائرية -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#text-grad)" stroke-width="16" stroke-opacity="0.4"/>

  <!-- حرف الألف "أ" المصمم بخط مودرن مع درع الأمان -->
  <g transform="translate(256, 270)">
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central" font-family="'Readex Pro', 'Segoe UI', sans-serif" font-weight="900" font-size="320" fill="url(#text-grad)">أ</text>
  </g>
</svg>